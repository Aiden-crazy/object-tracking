# ============================================================
# application.yml —— 综合实践III《单目标跟踪系统》Web 后端配置（默认使用内嵌 H2）
# 作者：【姓名】  学号：【学号】  创建时间：2026-07
# 默认 profile=h2：使用内嵌 H2 文件数据库，无需安装 MySQL，任何电脑双击即可运行。
# 如需使用 MySQL（本地开发），以 --spring.profiles.active=mysql 启动并先执行 sql/init.sql。
# ============================================================
spring:
  application:
    name: track-server
  profiles:
    active: h2
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 应用自定义配置
app:
  # Python 视觉服务地址（同机部署时保持默认）
  vision-url: http://127.0.0.1:9000
  # 上传文件与处理结果的存储根目录（相对启动目录）
  storage-dir: ./uploads

logging:
  level:
    com.zongshe3.track: info
