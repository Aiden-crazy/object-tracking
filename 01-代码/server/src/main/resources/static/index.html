<!DOCTYPE html>
<!--
 * index.html —— 综合实践III《单目标跟踪系统》系统首页
 * 作者：【姓名】  学号：【学号】  创建时间：2026-07
 * 功能描述：系统入口页，提供【网页检测端】与【Web 管理端】两个入口。
 * 访问：http://localhost:8080/（浏览器自动打开本页）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单目标跟踪系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #1e3c72 0%, #2a5298 55%, #3a6cb8 100%);
      color: #fff;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 60px 24px 40px; }
    .brand { text-align: center; margin-bottom: 14px; }
    .brand h1 { font-size: 40px; letter-spacing: 2px; }
    .brand .sub { color: #c8d8f0; font-size: 16px; margin-top: 10px; }
    .flow {
      background: rgba(255,255,255,.12); border-radius: 999px; padding: 10px 22px;
      margin: 26px auto 40px; display: table; font-size: 15px; color: #eef3fb;
    }
    .cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #fff; color: #333; width: 330px; border-radius: 18px;
      padding: 30px 26px; text-align: center; cursor: pointer;
      box-shadow: 0 12px 36px rgba(0,0,0,.22); transition: transform .18s, box-shadow .18s;
      text-decoration: none;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 18px 44px rgba(0,0,0,.3); }
    .card .icon { font-size: 52px; line-height: 1; }
    .card h2 { margin: 16px 0 8px; color: #2a5298; font-size: 22px; }
    .card p { color: #777; font-size: 14px; line-height: 1.7; }
    .card .go {
      display: inline-block; margin-top: 16px; padding: 9px 26px; border-radius: 999px;
      background: #2a5298; color: #fff; font-size: 15px;
    }
    .card.admin .go { background: #27ae60; }
    .tips { margin-top: 44px; color: #cfe0f5; font-size: 13px; text-align: center; line-height: 2; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>单目标跟踪系统</h1>
      <div class="sub">综合实践III 课程设计 · 基于 OpenCV 的智能单目标跟踪</div>
    </div>
    <div class="flow">登录 → 上传视频 → 服务端视觉跟踪（含遮挡自动重检测）→ 结果回看</div>

    <div class="cards">
      <a class="card" href="track.html">
        <div class="icon">🎥</div>
        <h2>网页检测端</h2>
        <p>把视频拖进网页（或 Ctrl+V 粘贴）即可开始跟踪检测<br>支持框选目标、结果回看与历史记录</p>
        <span class="go">进入检测 →</span>
      </a>
      <a class="card admin" href="admin.html">
        <div class="icon">🛠️</div>
        <h2>Web 管理端</h2>
        <p>管理员入口：用户增删改查、重置密码、任务记录管理与结果播放<br>（默认账号 admin / 123456）</p>
        <span class="go">进入管理 →</span>
      </a>
    </div>

    <div class="tips">
      一键启动脚本：<b>启动-网页检测端.bat</b> ／ <b>启动-管理端.bat</b>（详见 README.md）
    </div>
  </div>
</body>
</html>
