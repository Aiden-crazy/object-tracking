# ============================================================
# application-h2.yml —— 内嵌 H2 数据库（默认，零外部依赖）
# 数据库文件自动生成于启动目录 ./trackdb.mv.db（已加入 .gitignore）
# ============================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./trackdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
